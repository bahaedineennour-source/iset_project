services:
  postgres:
    image: postgres:16
    container_name: university_courses_db
    environment:
      POSTGRES_DB: university_courses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - university_courses_data:/var/lib/postgresql/data

volumes:
  university_courses_data:
