spring.application.name=university-courses
server.port=8080

# PostgreSQL connection — override with environment variables or application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/university_courses}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.config.import=optional:classpath:application-local.properties
